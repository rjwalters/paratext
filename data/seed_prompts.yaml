# Seed prompts for textual-intuition.
#
# Each prompt is a "polished_neutral"-style baseline. The variant generator
# perturbs surface form while preserving semantic content. Prompts should be
# realistic enough that tone and typo variation could plausibly influence the
# assistant's response style.
#
# Domains (8): coding, math, hardware_safety, parenting, travel, writing,
# startup, planning. At least 5 prompts per domain.

# ---------------------------------------------------------------------------
# Coding / debugging
# ---------------------------------------------------------------------------
- id: coding_001
  domain: coding
  base_prompt: "Can you help me understand why this Python function sometimes returns None when I expected a list?"
  tags: [debugging, low_stakes]
  notes: "Generic debugging prompt."

- id: coding_002
  domain: coding
  base_prompt: "I have a recursive function that hits a stack overflow on inputs larger than about 1000. What's the cleanest way to convert it to an iterative version?"
  tags: [refactoring, algorithms]
  notes: ""

- id: coding_003
  domain: coding
  base_prompt: "My pytest suite passes locally but fails in CI with a timezone-related assertion error. Where should I start looking?"
  tags: [debugging, testing, ci]
  notes: ""

- id: coding_004
  domain: coding
  base_prompt: "What's the difference between asyncio.gather and asyncio.wait, and when would I prefer one over the other?"
  tags: [concepts, async]
  notes: ""

- id: coding_005
  domain: coding
  base_prompt: "I'm getting an ImportError when I run my package as a script but not when I import it from a notebook. What's going on?"
  tags: [debugging, packaging]
  notes: ""

- id: coding_006
  domain: coding
  base_prompt: "How do I structure a small CLI tool in Python so it's easy to test? I keep ending up with a giant main function."
  tags: [architecture, low_stakes]
  notes: ""

